<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portaria 1</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/cadastro.css">
</head>
<body>

<header>
  <div class="avatar">👤</div>
  <div><strong>Olá Matheus</strong><small>Portaria 1</small></div>
  <div class="search hidden" id="search"><input type="text" id="busca" placeholder="Pesquisar cargas e motoristas..."></div>
</header>

<!-- TELA 1: DASHBOARD -->
<main id="viewDash">
  <section class="stats">
    <div class="stat"><div class="ic" style="background:#e3edff">🚚</div><b id="nPatio" style="color:var(--orange)">0</b><span>Caminhões no pátio</span></div>
    <div class="stat"><div class="ic" style="background:#dcf5e5">⬇</div><b id="nHoje" style="color:var(--green)">0</b><span>Entradas hoje</span></div>
    <div class="stat"><div class="ic" style="background:#fde2dd">⚠</div><b id="nAtencao" style="color:#e0452f">0</b><span>Precisam de atenção</span></div>
  </section>

  <div class="top">
    <h2>Motoristas</h2>
    <button class="btn btn-primary" id="btnCadastrar">+ Cadastrar motorista</button>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-f="todos">Todos</button>
    <button class="tab" data-f="patio">No pátio agora</button>
    <button class="tab" data-f="chegando">Chegando</button>
    <button class="tab" data-f="saiu">Já saíram</button>
  </div>
  <div id="lista"></div>
</main>

<!-- TELA 2: CADASTRO -->
<main id="viewCadastro" class="hidden">
  <button class="back" id="btnVoltar">← Voltar ao painel</button>
  <div class="layout">
    <div>
      <div class="panel">
        <h3>👤 Dados do motorista</h3>
        <div class="grid">
          <div><label>Nome completo <i>*</i></label><input type="text" id="nome" placeholder="Ex.: Carlos Silva Santos"></div>
          <div><label>CPF <i>*</i></label><input type="text" id="cpf" maxlength="14" placeholder="000.000.000-00"></div>
          <div><label>CNH <i>*</i></label><input type="text" id="cnh" maxlength="11" placeholder="11 dígitos"></div>
          <div><label>Categoria</label>
            <select id="cat"><option>A</option><option>B</option><option>C</option><option>D</option><option selected>E</option></select></div>
          <div><label>Placa <i>*</i></label><input type="text" id="placa" maxlength="7" placeholder="ABC1D23"></div>
        </div>
      </div>
      <div class="panel">
        <h3>✓ Checklist de segurança</h3>
        <label class="check"><input type="checkbox" class="ck"><span class="box"></span><span><b>EPIs conferidos</b><small>Capacete, colete e botas de segurança</small></span></label>
        <label class="check"><input type="checkbox" class="ck"><span class="box"></span><span><b>Lacre da carga verificado</b><small>Número confere com a nota fiscal</small></span></label>
        <label class="check"><input type="checkbox" class="ck"><span class="box"></span><span><b>Vistoria do veículo realizada</b><small>Pneus, luzes e fitas inspecionados</small></span></label>
      </div>
    </div>
    <aside>
      <div class="panel sum">
        <h3>Resumo da carga</h3>
        <div class="l">Placa <b id="sPlaca">—</b></div>
        <div class="l">Doca <b>—</b></div>
        <div class="l">Tipo <b>—</b></div>
        <hr>
        <div class="l">Chegada <b id="sCheg">—</b></div>
        <div class="l">Liberação prevista <b id="sPrev">—</b></div>
      </div>
      <div class="panel sum">
        <button class="btn" id="btnLiberar" disabled>Liberar motorista</button>
        <p id="hint">Conclua o checklist para liberar a saída</p>
      </div>
    </aside>
  </div>
</main>

<!-- A ordem importa: scripts compartilham variáveis globais -->
<script src="js/state.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/cadastro.js"></script>
<script src="js/main.js"></script>
</body>
</html>
