<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FAST | Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="pagina">
    <section class="painel">
      <div class="caixa">
        <div class="logo">
          <!-- Se tiver o logo em imagem: <img src="../img/logo.png" alt="FAST Gôndolas & Check-outs"> -->
          <div class="marca">FAST</div>
          <small>Gôndolas &amp; Check-outs</small>
        </div>

        <h1>Faça seu login</h1>

        <form id="form-login" novalidate>
          <div class="campo">
            <label for="usuario">Usuário</label>
            <input type="text" id="usuario" autocomplete="username">
          </div>

          <div class="campo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" autocomplete="current-password">
            <button type="button" class="olho" id="olho" aria-label="Mostrar senha">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>

          <a href="#" class="esqueci">Esqueci minha senha</a>
          <div id="msg" class="mensagem" role="alert"></div>
          <button type="submit" class="btn">Entrar</button>
        </form>

        <p class="troca">Ainda não tem conta? <a href="../cadastro/cadastro.html">Cadastre-se</a></p>
      </div>
    </section>
    <aside class="arte" aria-hidden="true"></aside>
  </main>
  <script src="login.js"></script>
</body>
</html>
