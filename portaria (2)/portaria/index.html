<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portaria 1</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/painel.css">
<link rel="stylesheet" href="css/cadastro.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-caminhao" viewBox="0 0 24 24"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></symbol>
  <symbol id="i-usuario" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
  <symbol id="i-entrada" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></symbol>
  <symbol id="i-alerta" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
  <symbol id="i-busca" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
</svg>

<header>
  <div class="avatar"><svg class="icone"><use href="#i-usuario"/></svg></div>
  <div class="saudacao"><strong>Olá Matheus</strong><small>Portaria 1</small></div>
  <div class="busca escondido" id="areaBusca">
    <svg class="icone"><use href="#i-busca"/></svg>
    <input type="text" id="busca" placeholder="Pesquisar cargas e motoristas...">
  </div>
</header>

<!-- tela 1: painel do porteiro -->
<main id="telaPainel">
  <section class="indicadores">
    <div class="indicador">
      <div class="icone-indicador" style="background:#e3edff;color:#2f6fd6"><svg class="icone"><use href="#i-caminhao"/></svg></div>
      <b id="qtdPatio" style="color:var(--laranja)">0</b>
      <span>Caminhões no pátio</span>
    </div>
    <div class="indicador">
      <div class="icone-indicador" style="background:#dcf5e5;color:#1f9a4a"><svg class="icone"><use href="#i-entrada"/></svg></div>
      <b id="qtdHoje" style="color:var(--verde)">0</b>
      <span>Entradas hoje</span>
    </div>
    <div class="indicador">
      <div class="icone-indicador" style="background:#fde2dd;color:#d94430"><svg class="icone"><use href="#i-alerta"/></svg></div>
      <b id="qtdAtencao" style="color:#e0452f">0</b>
      <span>Precisam de atenção</span>
    </div>
  </section>

  <div class="titulo-lista">
    <h2>Motoristas</h2>
    <button class="botao botao-verde" id="btnCadastrar">Cadastrar motorista</button>
  </div>

  <div class="filtros" id="filtros">
    <button class="filtro ativo" data-filtro="todos">Todos</button>
    <button class="filtro" data-filtro="patio">No pátio agora</button>
    <button class="filtro" data-filtro="saiu">Já saíram</button>
  </div>

  <div id="listaMotoristas"></div>
</main>

<!-- tela 2: cadastro do motorista -->
<main id="telaCadastro" class="escondido">
  <button class="voltar" id="btnVoltar">← Voltar ao painel</button>
  <div class="layout">
    <div>
      <section class="cartao">
        <h3><svg class="icone"><use href="#i-usuario"/></svg>Dados do motorista</h3>
        <div class="grade">
          <div class="campo" id="campo-nome">
            <label for="nome">Nome completo <i>*</i></label>
            <input type="text" id="nome" autocomplete="off">
            <span class="erro" id="erro-nome"></span>
          </div>
          <div class="campo" id="campo-cpf">
            <label for="cpf">CPF <i>*</i></label>
            <input type="text" id="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00">
            <span class="erro" id="erro-cpf"></span>
          </div>
          <div class="campo" id="campo-cnh">
            <label for="cnh">CNH <i>*</i></label>
            <input type="text" id="cnh" inputmode="numeric" maxlength="11">
            <span class="erro" id="erro-cnh"></span>
          </div>
          <div class="campo">
            <label for="categoria">Categoria</label>
            <select id="categoria"><option>A</option><option>B</option><option>C</option><option>D</option><option selected>E</option></select>
          </div>
          <div class="campo" id="campo-placa">
            <label for="placa">Placa <i>*</i></label>
            <input type="text" id="placa" autocomplete="off" maxlength="7" placeholder="ABC1D23">
            <span class="erro" id="erro-placa"></span>
          </div>
        </div>
      </section>

      <section class="cartao">
        <h3>✓ Checklist de segurança</h3>
        <label class="item-checklist"><input type="checkbox" class="marcador"><span class="caixa"></span><span><b>EPIs conferidos</b><small>Capacete, colete e botas de segurança</small></span></label>
        <label class="item-checklist"><input type="checkbox" class="marcador"><span class="caixa"></span><span><b>Lacre da carga verificado</b><small>Número confere com a nota fiscal</small></span></label>
        <label class="item-checklist"><input type="checkbox" class="marcador"><span class="caixa"></span><span><b>Vistoria do veículo realizada</b><small>Pneus, luzes e fitas inspecionados</small></span></label>
      </section>
    </div>

    <aside>
      <section class="cartao resumo">
        <h3>Resumo da carga</h3>
        <div class="linha-resumo"><span>Placa</span><b id="resPlaca">—</b></div>
        <div class="linha-resumo"><span>Motorista</span><b id="resNome">—</b></div>
        <div class="linha-resumo"><span>Categoria</span><b id="resCategoria">E</b></div>
        <hr>
        <div class="linha-resumo"><span>Chegada</span><b id="resChegada">—</b></div>
      </section>
      <section class="cartao resumo">
        <button class="botao-liberar" id="btnLiberar" disabled>Liberar motorista</button>
        <p id="dicaLiberar">Conclua o checklist para liberar a entrada</p>
      </section>
    </aside>
  </div>
</main>

<!-- a ordem importa: os scripts usam as mesmas variáveis -->
<script src="js/estado.js"></script>
<script src="js/painel.js"></script>
<script src="js/cadastro.js"></script>
<script src="js/principal.js"></script>
</body>
</html>
